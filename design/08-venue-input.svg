<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 756" width="376" height="756">
<style>
  .f { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Nanum Gothic','WenQuanYi Zen Hei',sans-serif; }
  .ink { fill: #2B2724; }
  .mute { fill: #94897F; }
  .rose { fill: #C4756B; }
  .white { fill: #FFFFFF; }
  .b { font-weight: 700; }
  .sb { font-weight: 600; }
</style>
<rect width="376" height="756" fill="#F4F1EE"/>
<g transform="translate(18,18)">
  <rect width="340" height="720" rx="30" fill="#FFFFFF" stroke="#E5DED8"/>
  <text class="f mute" x="24" y="36" font-size="10.5">9:41</text>

  <path d="M32 58 l-7 7 l7 7" stroke="#2B2724" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f mute" x="46" y="70" font-size="11">웨딩홀 비교</text>

  <text class="f b ink" x="24" y="100" font-size="19">웨딩홀 기록</text>
  <text class="f mute" x="24" y="119" font-size="10.5">투어하면서 바로 적어보세요 · 자동 저장돼요</text>

  <!-- 기본 -->
  <rect x="20" y="140" width="300" height="88" rx="16" fill="#FFFFFF" stroke="#EAE4DF"/>
  <rect x="21" y="141" width="298" height="45" rx="15" fill="#FDF7F6"/>
  <text class="f ink" x="40" y="172" font-size="11.5">홀 이름</text>
  <text class="f sb ink" x="292" y="172" font-size="12.5" text-anchor="end">A 웨딩홀</text>
  <rect x="298" y="160" width="2" height="16" fill="#C4756B"/>
  <line x1="40" y1="188" x2="300" y2="188" stroke="#F2EDE9"/>
  <text class="f ink" x="40" y="214" font-size="11.5">투어 날짜</text>
  <text class="f sb ink" x="300" y="214" font-size="12" text-anchor="end">8월 2일 (일)</text>

  <!-- 금액 -->
  <text class="f b ink" x="24" y="250" font-size="13">금액</text>
  <text class="f mute" x="300" y="250" font-size="9.5" text-anchor="end">받은 견적 그대로 적어주세요</text>
  <rect x="20" y="260" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#EAE4DF"/>

  <text class="f ink" x="40" y="290" font-size="11.5">홀 사용료</text>
  <text class="f sb ink" x="300" y="290" font-size="12" text-anchor="end">5,000,000</text>
  <text class="f ink" x="40" y="322" font-size="11.5">꽃장식</text>
  <text class="f sb ink" x="300" y="322" font-size="12" text-anchor="end">1,200,000</text>
  <text class="f ink" x="40" y="354" font-size="11.5">식대 (1인)</text>
  <text class="f sb ink" x="300" y="354" font-size="12" text-anchor="end">68,000</text>
  <text class="f ink" x="40" y="386" font-size="11.5">보증인원</text>
  <text class="f sb ink" x="300" y="386" font-size="12" text-anchor="end">200명</text>

  <line x1="40" y1="404" x2="300" y2="404" stroke="#EAE4DF"/>
  <text class="f b ink" x="40" y="428" font-size="12">예상 합계</text>
  <text class="f b rose" x="300" y="429" font-size="14" text-anchor="end">19,800,000</text>
  <text class="f mute" x="24" y="456" font-size="9" opacity="0.8">홀 사용료 + 꽃장식 + (보증인원 × 식대) · 보증인원은 2~3주 전 최종 결정</text>

  <!-- 포함 여부 -->
  <text class="f b ink" x="24" y="486" font-size="13">포함 여부</text>
  <rect x="20" y="496" width="300" height="112" rx="16" fill="#FFFFFF" stroke="#EAE4DF"/>
  <text class="f ink" x="40" y="528" font-size="11.5">신부대기실</text>
  <rect x="188" y="511" width="120" height="26" rx="13" fill="#F4F1EE"/>
  <rect x="190" y="513" width="36" height="22" rx="11" fill="#FFFFFF" stroke="#D8D0C9" stroke-width="0.8"/>
  <text class="f sb ink" x="208" y="528" font-size="10.5" text-anchor="middle">있음</text>
  <text class="f mute" x="248" y="528" font-size="10.5" text-anchor="middle" opacity="0.75">없음</text>
  <text class="f mute" x="288" y="528" font-size="10.5" text-anchor="middle" opacity="0.75">모름</text>
  <text class="f ink" x="40" y="564" font-size="11.5">폐백실</text>
  <rect x="188" y="547" width="120" height="26" rx="13" fill="#F4F1EE"/>
  <rect x="190" y="549" width="36" height="22" rx="11" fill="#FFFFFF" stroke="#D8D0C9" stroke-width="0.8"/>
  <text class="f sb ink" x="208" y="564" font-size="10.5" text-anchor="middle">있음</text>
  <text class="f mute" x="248" y="564" font-size="10.5" text-anchor="middle" opacity="0.75">없음</text>
  <text class="f mute" x="288" y="564" font-size="10.5" text-anchor="middle" opacity="0.75">모름</text>
  <text class="f ink" x="40" y="600" font-size="11.5">혼구용품</text>
  <rect x="188" y="583" width="120" height="26" rx="13" fill="#F4F1EE"/>
  <rect x="190" y="585" width="36" height="22" rx="11" fill="#FFFFFF" stroke="#D8D0C9" stroke-width="0.8"/>
  <text class="f sb ink" x="208" y="600" font-size="10.5" text-anchor="middle">있음</text>
  <text class="f mute" x="248" y="600" font-size="10.5" text-anchor="middle" opacity="0.75">없음</text>
  <text class="f mute" x="288" y="600" font-size="10.5" text-anchor="middle" opacity="0.75">모름</text>

  <!-- 메모 -->
  <rect x="20" y="620" width="300" height="42" rx="16" fill="#FFFFFF" stroke="#EAE4DF"/>
  <text class="f ink" x="40" y="646" font-size="11.5">메모</text>
  <rect x="148" y="633" width="46" height="18" rx="9" fill="#F1EDE9"/>
  <text class="f sb mute" x="171" y="646" font-size="9" text-anchor="middle">사진 1</text>
  <text class="f mute" x="300" y="646" font-size="10" text-anchor="end">주차 200대…</text>

  <!-- 저장 -->
  <rect x="0" y="672" width="340" height="48" fill="#FFFFFF" opacity="0.96"/>
  <line x1="0" y1="672" x2="340" y2="672" stroke="#EFE9E4"/>
  <rect x="24" y="680" width="292" height="34" rx="17" fill="#C4756B"/>
  <text class="f sb white" x="170" y="702" font-size="12.5" text-anchor="middle">비교표에 담기</text>
</g>
</svg>
