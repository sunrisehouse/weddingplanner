  <circle cx="46" cy="349" r="8" fill="#6E8B6F"/>
  <path d="M42.5 349 l2.6 2.6 l4.6 -5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f mute" x="64" y="353" font-size="12.5" text-decoration="line-through">스드메 예약</text>
  <circle cx="46" cy="377" r="8" fill="none" stroke="#D8D0C9" stroke-width="1.6"/>
  <text class="f ink" x="64" y="381" font-size="12.5">웨딩홀 투어</text>
  <circle cx="46" cy="405" r="8" fill="none" stroke="#D8D0C9" stroke-width="1.6"/>
  <text class="f ink" x="64" y="409" font-size="12.5">본식스냅 / DVD 예약</text>

