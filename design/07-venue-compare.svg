<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 756" width="376" height="756">
<style>
  .f { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Nanum Gothic','WenQuanYi Zen Hei',sans-serif; }
  .ink { fill: #2B2724; }
  .mute { fill: #94897F; }
  .rose { fill: #C4756B; }
  .white { fill: #FFFFFF; }
  .b { font-weight: 700; }
  .sb { font-weight: 600; }
</style>
<rect width="376" height="756" fill="#F4F1EE"/>
<g transform="translate(18,18)">
  <rect width="340" height="720" rx="30" fill="#FFFFFF" stroke="#E5DED8"/>
  <text class="f mute" x="24" y="36" font-size="10.5">9:41</text>

  <path d="M32 58 l-7 7 l7 7" stroke="#2B2724" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f mute" x="46" y="70" font-size="11">체크리스트 · 웨딩홀</text>

  <text class="f b ink" x="24" y="100" font-size="19">웨딩홀 비교</text>
  <text class="f mute" x="24" y="119" font-size="10.5">투어하면서 직접 적은 내용이에요</text>

  <!-- 열 헤더 -->
  <rect x="120" y="132" width="98" height="44" rx="10" fill="#F1EDE9"/>
  <text class="f sb ink" x="169" y="152" font-size="12" text-anchor="middle">A 웨딩홀</text>
  <text class="f mute" x="169" y="167" font-size="9" text-anchor="middle">8/2 투어</text>
  <rect x="222" y="132" width="98" height="44" rx="10" fill="#F7F4F1"/>
  <text class="f sb ink" x="271" y="152" font-size="12" text-anchor="middle">B 웨딩홀</text>
  <text class="f mute" x="271" y="167" font-size="9" text-anchor="middle">8/9 투어</text>

  <!-- 금액 -->
  <text class="f ink" x="24" y="204" font-size="11.5">홀 사용료</text>
  <text class="f sb ink" x="169" y="204" font-size="11.5" text-anchor="middle">5,000,000</text>
  <text class="f mute" x="271" y="204" font-size="10" text-anchor="middle" opacity="0.7">미입력</text>

  <text class="f ink" x="24" y="232" font-size="11.5">꽃장식</text>
  <text class="f sb ink" x="169" y="232" font-size="11.5" text-anchor="middle">1,200,000</text>
  <text class="f mute" x="271" y="232" font-size="10" text-anchor="middle" opacity="0.7">미입력</text>

  <text class="f ink" x="24" y="260" font-size="11.5">식대 (1인)</text>
  <text class="f sb ink" x="169" y="260" font-size="11.5" text-anchor="middle">68,000</text>
  <text class="f sb ink" x="271" y="260" font-size="11.5" text-anchor="middle">62,000</text>

  <text class="f ink" x="24" y="288" font-size="11.5">보증인원</text>
  <text class="f sb ink" x="169" y="288" font-size="11.5" text-anchor="middle">200명</text>
  <text class="f mute" x="271" y="288" font-size="10" text-anchor="middle" opacity="0.7">미입력</text>

  <line x1="20" y1="302" x2="320" y2="302" stroke="#EAE4DF"/>

  <text class="f b ink" x="24" y="326" font-size="12">예상 합계</text>
  <text class="f b rose" x="169" y="327" font-size="13" text-anchor="middle">19,800,000</text>
  <text class="f mute" x="271" y="326" font-size="10" text-anchor="middle" opacity="0.7">계산 불가</text>
  <text class="f mute" x="24" y="344" font-size="9" opacity="0.8">홀 사용료 + 꽃장식 + (보증인원 × 식대) · 보증인원은 2~3주 전 최종 결정</text>

  <line x1="20" y1="358" x2="320" y2="358" stroke="#EAE4DF"/>

  <!-- 포함 여부 -->
  <text class="f ink" x="24" y="382" font-size="11.5">신부대기실</text>
  <text class="f sb" x="169" y="382" font-size="12" text-anchor="middle" fill="#6E8B6F">있음</text>
  <text class="f sb" x="271" y="382" font-size="12" text-anchor="middle" fill="#6E8B6F">있음</text>

  <text class="f ink" x="24" y="408" font-size="11.5">폐백실</text>
  <text class="f sb" x="169" y="408" font-size="12" text-anchor="middle" fill="#6E8B6F">있음</text>
  <text class="f sb rose" x="271" y="408" font-size="12" text-anchor="middle">없음</text>

  <text class="f ink" x="24" y="434" font-size="11.5">혼구용품</text>
  <text class="f sb" x="169" y="434" font-size="12" text-anchor="middle" fill="#6E8B6F">있음</text>
  <text class="f mute" x="271" y="434" font-size="10" text-anchor="middle" opacity="0.7">미입력</text>

  <!-- 내 결정과 어긋나는 부분 -->
  <rect x="20" y="448" width="300" height="34" rx="10" fill="#FAEEEC"/>
  <text class="f sb rose" x="36" y="463" font-size="9.5">폐백을 하기로 하셨는데 B 웨딩홀은 폐백실이 없어요</text>
  <text class="f rose" x="36" y="476" font-size="9" opacity="0.75">체크리스트에서 폐백을 '진행'으로 두셨어요</text>

  <line x1="20" y1="496" x2="320" y2="496" stroke="#EAE4DF"/>

  <text class="f ink" x="24" y="518" font-size="11.5">메모</text>
  <text class="f mute" x="169" y="518" font-size="9.5" text-anchor="middle">주차 200대</text>
  <text class="f mute" x="169" y="532" font-size="9.5" text-anchor="middle">예식 간격 90분</text>
  <text class="f mute" x="271" y="518" font-size="9.5" text-anchor="middle" opacity="0.7">미입력</text>

  <rect x="20" y="552" width="300" height="40" rx="14" fill="#FBFAF9" stroke="#D8D0C9" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="f sb mute" x="170" y="577" font-size="11.5" text-anchor="middle">＋ 웨딩홀 추가</text>

  <text class="f mute" x="24" y="614" font-size="9.5" opacity="0.75">앱은 순위를 매기거나 추천하지 않아요</text>
  <text class="f mute" x="24" y="628" font-size="9.5" opacity="0.75">적어두신 것을 나란히 놓아드릴 뿐이에요</text>

  <line x1="0" y1="656" x2="340" y2="656" stroke="#EFE9E4"/>
  <text class="f mute" x="47"  y="688" font-size="10.5" text-anchor="middle">홈</text>
  <text class="f sb rose"  x="132" y="688" font-size="10.5" text-anchor="middle">체크리스트</text>
  <text class="f mute" x="217" y="688" font-size="10.5" text-anchor="middle">일정</text>
  <text class="f mute" x="295" y="688" font-size="10.5" text-anchor="middle">비용</text>
  <rect x="106" y="700" width="52" height="2.5" rx="1.25" fill="#C4756B"/>
</g>
</svg>
