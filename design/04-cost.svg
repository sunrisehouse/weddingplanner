  <rect x="226" y="504" width="74" height="20" rx="10" fill="#FBFAF9" stroke="#D8D0C9" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="f sb mute" x="263" y="518" font-size="10" text-anchor="middle">입력</text>

  <text class="f ink" x="40" y="556" font-size="12">드레스 헬퍼비 · 본식</text>
