  <rect x="226" y="544" width="74" height="20" rx="10" fill="#FBFAF9" stroke="#D8D0C9" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="f sb mute" x="263" y="558" font-size="10" text-anchor="middle">입력</text>

  <text class="f ink" x="40" y="596" font-size="12">메이크업 얼리스타트</text>
  <rect x="226" y="584" width="74" height="20" rx="10" fill="#FBFAF9" stroke="#D8D0C9" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="f sb mute" x="263" y="598" font-size="10" text-anchor="middle">입력</text>

  <text class="f mute" x="24" y="636" font-size="9.5" opacity="0.75">투어비 · 출장비 2건 더 있어요</text>

  <line x1="0" y1="656" x2="340" y2="656" stroke="#EFE9E4"/>
  <text class="f mute" x="47"  y="688" font-size="10.5" text-anchor="middle">홈</text>
  <text class="f mute" x="132" y="688" font-size="10.5" text-anchor="middle">체크리스트</text>
  <text class="f mute" x="217" y="688" font-size="10.5" text-anchor="middle">일정</text>
  <text class="f sb rose"  x="295" y="688" font-size="10.5" text-anchor="middle">비용</text>
  <rect x="278" y="700" width="34" height="2.5" rx="1.25" fill="#C4756B"/>
