  <text class="f mute" x="56" y="477" font-size="10.5">계약서에 '별도' 표시</text>
  <rect x="56" y="484" width="66" height="18" rx="9" fill="#FBFAF9" stroke="#D8D0C9" stroke-width="1.1" stroke-dasharray="3 3"/>
